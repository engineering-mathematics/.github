name: Bug report
description: Something is wrong or numerically incorrect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do **not** file here, see SECURITY.md.
        Wrong numerical results are bugs: please include an expected value and its source.
  - type: input
    id: package
    attributes: { label: Package and version, placeholder: engg-math-linear-systems 0.1.0 }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, render: python }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual, description: "Include the reference value, tolerance and where it comes from." }
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `engg-math doctor` if available, otherwise Python, OS, NumPy/SciPy versions and BLAS backend.
    validations: { required: true }
