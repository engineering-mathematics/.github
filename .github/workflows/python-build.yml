# Reusable release build: wheel + sdist, CycloneDX SBOM, signed provenance.
# Publishing stays in each repo's release.yml: PyPI Trusted Publishing binds to the calling workflow.
name: Python build and attest (reusable)

on:
  workflow_call:
    inputs:
      sync-args:
        type: string
        default: ""
      build-args:
        description: Args for `uv build`, e.g. `--package engg-math-core`.
        type: string
        default: ""
      export-args:
        description: Args for `uv export` when generating the SBOM.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build, SBOM, attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python 3.11 ${{ inputs.sync-args }}
      - run: uv build ${{ inputs.build-args }}
      - name: CycloneDX SBOM from the lockfile
        run: |
          uv export --locked --no-dev --no-emit-project ${{ inputs.export-args }} --format requirements-txt -o /tmp/reqs.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/reqs.txt --of JSON -o dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
